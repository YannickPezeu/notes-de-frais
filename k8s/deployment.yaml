apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-de-frais
  namespace: epfl-chatbot
  labels:
    app: notes-de-frais
spec:
  # Un seul pod : quotas en mémoire (server/rate-limit.mjs) et compteurs d'usage dans un
  # fichier du volume (server/stats.mjs). Recreate : jamais deux pods qui écrivent ce fichier.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notes-de-frais
  template:
    metadata:
      labels:
        app: notes-de-frais
      annotations:
        # Remplacé à chaque déploiement par update.ps1 : un seul redémarrage par déploiement.
        notes-de-frais/deploy: "{{DEPLOY_ID}}"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: notes-de-frais
          # update.ps1 remplace :latest par l'empreinte (digest) de l'image qu'il vient de pousser :
          # le pod exécute exactement cette image, pas « la dernière » du registre.
          image: ic-registry.epfl.ch/mr-pezeu/notes-de-frais:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            # Secrets : un par un, rien d'autre du Secret n'entre dans le conteneur.
            - name: RCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notes-de-frais-secrets
                  key: RCP_API_KEY
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: notes-de-frais-secrets
                  key: SESSION_SECRET
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: notes-de-frais-secrets
                  key: ENTRA_CLIENT_SECRET
            - name: STATS_SECRET
              valueFrom:
                secretKeyRef:
                  name: notes-de-frais-secrets
                  key: STATS_SECRET
            # Mot de passe de la phase de test : facultatif, à retirer du Secret au feu vert.
            - name: ACCESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notes-de-frais-secrets
                  key: ACCESS_PASSWORD
                  optional: true
            - name: BASE_PATH
              value: /notes-de-frais
            - name: PUBLIC_URL
              value: https://expert-finder.epfl.ch/notes-de-frais
            - name: ALLOWED_ORIGINS
              value: https://sesame.epfl.ch
            # Application Entra « notesDeFrais » (App Portal EPFL) ; le secret client est dans le Secret.
            - name: ENTRA_TENANT_ID
              value: f6c2556a-c4fb-4ab1-a2c7-9e220df11c43
            - name: ENTRA_CLIENT_ID
              value: 7bf39c1e-e6cb-457f-b4c5-f77616dbcabc
            # Compteurs d'usage anonymes (personnes, appels, jetons), page /stats.
            - name: STATS_FILE
              value: /data/stats.json
            # Page /stats réservée à ces adresses (séparées par des virgules).
            - name: STATS_ADMINS
              value: yannick.pezeu@epfl.ch
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notes-de-frais-data
